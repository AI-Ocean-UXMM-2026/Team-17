name: Deploy Client Preview

on:
  workflow_dispatch:
    inputs:
      vercel_token_rotated:
        description: 'I revoked the exposed Vercel token and replaced VERCEL_TOKEN in GitHub Secrets'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vercel-client-preview
  cancel-in-progress: false

jobs:
  checks:
    # Release credentials are never available to this job.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:1/test
      DIRECT_URL: postgresql://test:test@127.0.0.1:1/test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      # Client pretest compiles the sibling server; install its locked dependencies too.
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - run: node --test .github/scripts/check-deployment-config.test.cjs
      - run: npm --prefix client run typecheck
      - run: npm --prefix client run lint -- --max-warnings=0
      - run: npm --prefix client test
      # The Preview environment build runs in the deployment job.
      - run: npm --prefix client run build

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging-client
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: '1'
    steps:
      - name: Require token revocation and replacement confirmation
        if: ${{ !inputs.vercel_token_rotated }}
        run: |
          echo "::error::Revoke the exposed Vercel token and replace VERCEL_TOKEN in GitHub Actions Secrets before deploying."
          exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check required deployment secrets
        shell: bash
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name}" ]]; then
              label="$name"
              echo "::error::Missing GitHub secret: $label"
              missing=1
            fi
          done
          exit "$missing"
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@65.2.0
      # Run CLI at repository root: Vercel applies the project's client/server Root Directory.
      - name: Pull Preview settings and environment
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Verify project mapping, settings, and environment names
        run: node .github/scripts/check-vercel-settings.cjs client
      - name: Build Preview output
        run: vercel build --environment=preview --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt Preview output
        id: deployment
        shell: bash
        run: |
          url="$(vercel deploy --prebuilt --environment=preview --yes --token="$VERCEL_TOKEN")"
          if [[ ! "$url" =~ ^https://[a-zA-Z0-9.-]+/?$ ]]; then
            echo "::error::Vercel did not return a valid deployment URL"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '### Client Preview\n\n%s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove downloaded environment and build output
        if: always()
        shell: bash
        run: rm -rf -- .vercel client/.vercel

